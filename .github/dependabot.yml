version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch and minor bumps, so review effort goes to
      # the major upgrades that can actually break the build.
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to SHAs, which means they never update on their own.
  # Dependabot rewrites the SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
